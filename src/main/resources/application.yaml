# Port Configuration
server:
  port: 8000
  address: 0.0.0.0
  servlet:
    context-path: /api/v1/

spring:
  application:
    name: bckend

  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/spring-backend
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true

  # Config Configuration
  config:
    import:
      - classpath:config.yml
      - optional:classpath:logging.yaml